apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fleet-demo-vm
  namespace: hhg-ns
  annotations:
    harvesterhci.io/volumeClaimTemplates: |-
      [
        {
          "metadata": {
            "name": "fleet-demo-vm-disk-0",
            "annotations": {
              "harvesterhci.io/imageId": "default/image-xxsqt"
            }
          },
          "spec": {
            "accessModes": [
              "ReadWriteMany"
            ],
            "resources": {
              "requests": {
                "storage": "20Gi"
              }
            },
            "volumeMode": "Block",
            "storageClassName": "longhorn-image-xxsqt"
          }
        }
      ]
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: fleet-demo-vm
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
          limits:
            memory: 4Gi
        features:
          acpi:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: disk-0
              disk:
                bus: virtio
              bootOrder: 1
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: vlan-net
              bridge: {}
      networks:
        - name: vlan-net
          multus:
            networkName: default/net65
      volumes:
        - name: disk-0
          persistentVolumeClaim:
            claimName: fleet-demo-vm-disk-0
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: demo
              password: password
              chpasswd: { expire: False }
              ssh_pwauth: True
              package_update: true
              packages: qemu-guest-agent
              runcmd: systemctl enable --now qemu-guest-agent